name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    needs: [lint, typecheck, test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build:worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Write cookies file
        run: |
          cat > e2e/fixtures/cookies.json << EOF
          [
            {
              "name": "sb-zdflqcdikfpxdihrpcrx-auth-token.0",
              "value": "${{ secrets.E2E_COOKIE_0 }}",
              "domain": "nutri-calc.natkuczma.workers.dev",
              "path": "/",
              "httpOnly": false,
              "secure": true,
              "sameSite": "Lax"
            },
            {
              "name": "sb-zdflqcdikfpxdihrpcrx-auth-token.1",
              "value": "${{ secrets.E2E_COOKIE_1 }}",
              "domain": "nutri-calc.natkuczma.workers.dev",
              "path": "/",
              "httpOnly": false,
              "secure": true,
              "sameSite": "Lax"
            }
          ]
          EOF
      - run: npx playwright test
        env:
          E2E_BASE_URL: https://nutri-calc.natkuczma.workers.dev
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
